<div class="pagination">
    {% if articles_page.has_previous() %}
        <a href="{{ SITEURL }}/{{ articles_page.previous_page_name() }}">&laquo; Previous</a>
    {% endif %}

    <span>Page {{ articles_page.number }} of {{ articles_page.paginator.num_pages }}</span>

    {% if articles_page.has_next() %}
        <a href="{{ SITEURL }}/{{ articles_page.next_page_name() }}">Next &raquo;</a>
    {% endif %}
</div>
