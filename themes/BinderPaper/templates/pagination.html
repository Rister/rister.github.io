<div class="pagination">
    <p class="paginator">
    {% if articles_page.has_previous() %}
        <a href="{{ SITEURL }}/{{ articles_page.previous_page_path() }}">&laquo; Previous</a>
    {% endif %}

    Page {{ articles_page.number }} of {{ articles_paginator.num_pages }}

    {% if articles_page.has_next() %}
        <a href="{{ SITEURL }}/{{ articles_page.next_page_path() }}">Next &raquo;</a>
    {% endif %}
    </p>
</div>
