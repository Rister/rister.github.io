[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rister.github.io"
version = "0.0.1"
description = "Pelican site for rister.github.io"
authors = [
    { name = "Jeremy Rist", email = "rist.jeremy@gmail.com" },
]
requires-python = ">=3.8"
dependencies = [
    "pelican",
    "markdown",
]

# Optional: Project URLs
# [project.urls]
# Homepage = "https://example.com"
# Repository = "https://github.com/user/project"

[tool.hatch.build.targets.wheel]
# Explicitly define the package directory.
# This helps Hatch understand what to include, especially for projects
# not following the traditional library structure (e.g., a Pelican site).
# We'll point it to a conventional 'src' layout.
packages = ["src/rister_github_io"]

[dependency-groups]
dev = [
    "ruff>=0.12.2",
]
